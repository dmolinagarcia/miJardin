<!doctype html>
<html lang="es">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">

<a class="saltar" href="#principal">Saltar al contenido</a>

<div class="avisos" id="avisos" aria-live="polite"></div>
