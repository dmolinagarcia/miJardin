# docker compose up -d --build
#
# El puerto solo se abre en 127.0.0.1: se entra a través de Caddy (o el proxy que uses),
# nunca directamente. Docker se salta ufw, así que no lo publiques en 0.0.0.0.
services:
  jardin:
    build: .
    image: jardin:latest
    container_name: jardin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUERTO:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PUERTO: "8080"
      DATOS: /datos
    volumes:
      - ./datos:/datos
    # Si Caddy corre en otro contenedor, quita «ports» y descomenta esto
    # (cambia «caddy» por el nombre de la red de tu Caddy):
    # networks: [caddy]

# networks:
#   caddy:
#     external: true
